apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

labels:
  - pairs:
      environment: prod

patches:
  - patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: kubeforge-platform-operator
      spec:
        source:
          targetRevision: v0.1.2
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
            allowEmpty: false
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
            - PruneLast=true
    target:
      kind: Application

  - patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: kubeforge
      spec:
        namespaceResourceWhitelist:
          - group: apps
            kind: Deployment
          - group: ""
            kind: Service
          - group: ""
            kind: ServiceAccount
          - group: rbac.authorization.k8s.io
            kind: Role
          - group: rbac.authorization.k8s.io
            kind: RoleBinding
          - group: monitoring.coreos.com
            kind: ServiceMonitor
    target:
      kind: AppProject