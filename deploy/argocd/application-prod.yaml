apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeforge-platform-operator-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: kubeforge
  source:
    repoURL: https://github.com/Yash-Singh/KubeForge
    targetRevision: main
    path: charts/platform-operator
    helm:
      values: |
        image:
          repository: ghcr.io/yash-singh/kubeforge
          tag: v0.2.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeforge-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
