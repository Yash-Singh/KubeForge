apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubeforge-platform-operator
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            valuesFile: values-dev.yaml
          - env: prod
            valuesFile: values-prod.yaml
  template:
    metadata:
      name: "kubeforge-platform-operator-{{env}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: kubeforge
      source:
        repoURL: https://github.com/Yash-Singh/KubeForge
        targetRevision: main
        path: charts/platform-operator
        helm:
          valueFiles:
            - "$values/charts/platform-operator/{{valuesFile}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: kubeforge-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 5
